name: CI and image publishing

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document validators
        run: python -m pip install -r requirements-ci.txt

      - name: Validate system and OpenAPI documents
        run: python scripts/validate_documents.py

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - habits
          - completions
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "CiSqlServer123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiSqlServer123 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service dependencies
        run: |
          python -m pip install -r services/${{ matrix.service }}/requirements.txt
          python -m pip install -r services/${{ matrix.service }}/requirements-dev.txt

      - name: Lint service
        run: ruff check services/${{ matrix.service }}

      - name: Test service
        working-directory: services/${{ matrix.service }}
        run: PYTHONPATH=. pytest -q --cov=app --cov-fail-under=70 --cov-report=term-missing

  integration:
    name: Cross-seam integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r services/habits/requirements.txt
          python -m pip install pytest==8.4.2

      - name: Run cross-seam test
        run: PYTHONPATH=services/habits:services/completions pytest -q tests/test_cross_seam.py

  images:
    name: Build ${{ matrix.service }} image
    needs:
      - validate
      - test
      - integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - habits
          - completions

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - test
      - integration
      - images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select Azure subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Preview SQL deployment
        run: |
          az deployment group what-if \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name sql-${{ github.sha }} \
            --template-file infra/sql.bicep \
            --parameters \
              prefix="${{ secrets.AZURE_RESOURCE_PREFIX }}" \
              sqlAdministratorPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"

      - name: Deploy SQL Server and databases
        run: |
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name sql-${{ github.sha }} \
            --template-file infra/sql.bicep \
            --parameters \
              prefix="${{ secrets.AZURE_RESOURCE_PREFIX }}" \
              sqlAdministratorPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
            --query properties.outputs

      - name: Install SQL driver
        run: python -m pip install pymssql==2.3.7

      - name: Create service database logins
        env:
          SQL_SERVER_FQDN: ${{ secrets.AZURE_RESOURCE_PREFIX }}.database.windows.net
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          HABITS_DB_PASSWORD: ${{ secrets.HABITS_DB_PASSWORD }}
          COMPLETIONS_DB_PASSWORD: ${{ secrets.COMPLETIONS_DB_PASSWORD }}
          AZURE_RESOURCE_PREFIX: ${{ secrets.AZURE_RESOURCE_PREFIX }}
        run: python scripts/init_azure_sql.py

      - name: Preview application deployment
        run: |
          az deployment group what-if \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name apps-${{ github.sha }} \
            --template-file infra/main.bicep \
            --parameters \
              prefix="${{ secrets.AZURE_RESOURCE_PREFIX }}" \
              sqlAdministratorPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
              habitsDatabasePassword="${{ secrets.HABITS_DB_PASSWORD }}" \
              completionsDatabasePassword="${{ secrets.COMPLETIONS_DB_PASSWORD }}" \
              registryPassword="${{ secrets.GITHUB_TOKEN }}" \
              registryUsername="${{ github.repository_owner }}" \
              gitSha="${{ github.sha }}"

      - name: Deploy Container Apps and Static Web App
        id: deploy-apps
        run: |
          outputs=$(az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name apps-${{ github.sha }} \
            --template-file infra/main.bicep \
            --parameters \
              prefix="${{ secrets.AZURE_RESOURCE_PREFIX }}" \
              sqlAdministratorPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
              habitsDatabasePassword="${{ secrets.HABITS_DB_PASSWORD }}" \
              completionsDatabasePassword="${{ secrets.COMPLETIONS_DB_PASSWORD }}" \
              registryPassword="${{ secrets.GITHUB_TOKEN }}" \
              registryUsername="${{ github.repository_owner }}" \
              gitSha="${{ github.sha }}" \
            --query properties.outputs -o json)
          echo "HABITS_FQDN=$(echo "$outputs" | jq -r '.habitsFqdn.value')" >> "$GITHUB_ENV"
          echo "COMPLETIONS_FQDN=$(echo "$outputs" | jq -r '.completionsFqdn.value')" >> "$GITHUB_ENV"
          echo "STATIC_URL=$(echo "$outputs" | jq -r '.staticWebAppUrl.value')" >> "$GITHUB_ENV"

      - name: Configure static UI service URLs
        run: |
          cat > ui/config.js <<EOF
          window.APP_CONFIG = {
            habitsUrl: "https://${HABITS_FQDN}",
            completionsUrl: "https://${COMPLETIONS_FQDN}"
          };
          EOF

      - name: Deploy static UI
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ui
          output_location: ""

      - name: Wait for deployed health endpoints
        run: |
          for endpoint in "https://${HABITS_FQDN}/health" "https://${COMPLETIONS_FQDN}/health"; do
            for attempt in $(seq 1 90); do
              status=$(curl -k -sS -o /tmp/health.json -w '%{http_code}' "$endpoint" || true)
              if [ "$status" = 200 ]; then
                echo "$endpoint healthy: $(cat /tmp/health.json)"
                break
              fi
              sleep 2
            done
            [ "$status" = 200 ] || { echo "$endpoint failed health check"; exit 1; }
          done
