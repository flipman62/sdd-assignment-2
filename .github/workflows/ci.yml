name: CI and image publishing

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document validators
        run: python -m pip install -r requirements-ci.txt

      - name: Validate system and OpenAPI documents
        run: python scripts/validate_documents.py

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - habits
          - completions
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "CiSqlServer123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiSqlServer123 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service dependencies
        run: |
          python -m pip install -r services/${{ matrix.service }}/requirements.txt
          python -m pip install -r services/${{ matrix.service }}/requirements-dev.txt

      - name: Lint service
        run: ruff check services/${{ matrix.service }}

      - name: Test service
        working-directory: services/${{ matrix.service }}
        run: PYTHONPATH=. pytest -q --cov=app --cov-fail-under=70 --cov-report=term-missing

  integration:
    name: Cross-seam integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r services/habits/requirements.txt
          python -m pip install pytest==8.4.2

      - name: Run cross-seam test
        run: PYTHONPATH=services/habits:services/completions pytest -q tests/test_cross_seam.py

  images:
    name: Build ${{ matrix.service }} image
    needs:
      - validate
      - test
      - integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - habits
          - completions

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
