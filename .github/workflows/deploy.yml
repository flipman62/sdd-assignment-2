name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  deploy:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
      HABITS_DB_PASSWORD: ${{ secrets.HABITS_DB_PASSWORD }}
      COMPLETIONS_DB_PASSWORD: ${{ secrets.COMPLETIONS_DB_PASSWORD }}
      PREFIX: ${{ vars.PREFIX }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      UI_STORAGE: ${{ vars.UI_STORAGE }}
      SQL_LOCATION: ${{ vars.SQL_LOCATION || 'francecentral' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select subscription and validate configuration
        run: |
          set -euo pipefail
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$PREFIX"
          test -n "$RESOURCE_GROUP"
          test -n "$UI_STORAGE"
          test -n "$SQL_ADMIN_PASSWORD"
          test -n "$HABITS_DB_PASSWORD"
          test -n "$COMPLETIONS_DB_PASSWORD"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Preview SQL deployment
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "sql-${GITHUB_SHA}" \
            --template-file infra/sql.bicep \
            --parameters \
              prefix="$PREFIX" \
              location="$SQL_LOCATION" \
              sqlAdministratorPassword="$SQL_ADMIN_PASSWORD"

      - name: Deploy SQL Server and databases
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "sql-${GITHUB_SHA}" \
            --template-file infra/sql.bicep \
            --parameters \
              prefix="$PREFIX" \
              location="$SQL_LOCATION" \
              sqlAdministratorPassword="$SQL_ADMIN_PASSWORD" \
            --query properties.outputs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQL driver
        run: python -m pip install --only-binary=:all: pymssql==2.3.7

      - name: Create service database users
        env:
          SQL_SERVER_FQDN: ${{ vars.PREFIX }}-sql.database.windows.net
          AZURE_RESOURCE_PREFIX: ${{ vars.PREFIX }}
          AZURE_RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          runner_ip=$(curl -fsS https://api.ipify.org)
          firewall_rule="gh-${GITHUB_RUN_ID}"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "${AZURE_RESOURCE_PREFIX}-sql" \
            --name "$firewall_rule" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip"
          if python scripts/init_azure_sql.py; then
            az sql server firewall-rule delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "${AZURE_RESOURCE_PREFIX}-sql" \
              --name "$firewall_rule"
          else
            init_status=$?
            az sql server firewall-rule delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "${AZURE_RESOURCE_PREFIX}-sql" \
              --name "$firewall_rule"
            exit "$init_status"
          fi

      - name: Preview UI storage deployment
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "ui-${GITHUB_SHA}" \
            --template-file infra/ui.bicep \
            --parameters uiStorageName="$UI_STORAGE"

      - name: Deploy and enable the static website
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "ui-${GITHUB_SHA}" \
            --template-file infra/ui.bicep \
            --parameters uiStorageName="$UI_STORAGE"
          az storage blob service-properties update \
            --account-name "$UI_STORAGE" \
            --auth-mode login \
            --static-website \
            --index-document index.html \
            --404-document 404.html
          ui_endpoint=$(az storage account show \
            --name "$UI_STORAGE" \
            --resource-group "$RESOURCE_GROUP" \
            --query primaryEndpoints.web -o tsv)
          if [[ -z "$ui_endpoint" ]]; then
            echo "Azure Storage did not return a static website endpoint." >&2
            exit 1
          fi
          echo "UI_ENDPOINT=$ui_endpoint" >> "$GITHUB_ENV"
          echo "UI_ORIGIN=${ui_endpoint%/}" >> "$GITHUB_ENV"

      - name: Preview application deployment
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-${GITHUB_SHA}" \
            --template-file infra/main.bicep \
            --parameters \
              prefix="$PREFIX" \
              uiOrigin="$UI_ORIGIN" \
              habitsDatabasePassword="$HABITS_DB_PASSWORD" \
              completionsDatabasePassword="$COMPLETIONS_DB_PASSWORD" \
              registryUsername="${GITHUB_REPOSITORY_OWNER}" \
              gitSha="$GITHUB_SHA"

      - name: Deploy Container Apps
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-${GITHUB_SHA}" \
            --template-file infra/main.bicep \
            --parameters \
              prefix="$PREFIX" \
              uiOrigin="$UI_ORIGIN" \
              habitsDatabasePassword="$HABITS_DB_PASSWORD" \
              completionsDatabasePassword="$COMPLETIONS_DB_PASSWORD" \
              registryUsername="${GITHUB_REPOSITORY_OWNER}" \
              gitSha="$GITHUB_SHA" \
            --query properties.outputs -o json)
          echo "HABITS_FQDN=$(echo "$outputs" | jq -r '.habitsFqdn.value')" >> "$GITHUB_ENV"
          echo "COMPLETIONS_FQDN=$(echo "$outputs" | jq -r '.completionsFqdn.value')" >> "$GITHUB_ENV"

      - name: Configure and upload static UI
        run: |
          cat > ui/config.js <<EOF
          window.APP_CONFIG = {
            habitsUrl: "https://${HABITS_FQDN}",
            completionsUrl: "https://${COMPLETIONS_FQDN}"
          };
          EOF
          az storage blob upload-batch \
            --account-name "$UI_STORAGE" \
            --auth-mode login \
            --destination '$web' \
            --source ui \
            --overwrite

      - name: Wait for deployed health endpoints
        run: |
          for endpoint in "https://${HABITS_FQDN}/health" "https://${COMPLETIONS_FQDN}/health"; do
            healthy=false
            for attempt in $(seq 1 90); do
              if curl -fsS --connect-timeout 5 --max-time 10 "$endpoint" -o /tmp/health.json 2>/dev/null; then
                echo "$endpoint healthy: $(cat /tmp/health.json)"
                healthy=true
                break
              fi
              sleep 2
            done
            if [[ "$healthy" != true ]]; then
              echo "$endpoint failed its health check after 90 attempts." >&2
              exit 1
            fi
          done
          echo "UI: $UI_ENDPOINT" >> "$GITHUB_STEP_SUMMARY"