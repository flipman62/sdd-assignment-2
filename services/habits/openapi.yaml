openapi: 3.0.3
info:
  title: Habits Service
  version: 1.0.0
paths:
  /health:
    get:
      summary: Check habits service and its database
      responses:
        "200":
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /habits:
    get:
      summary: List habits
      responses:
        "200":
          description: Habits returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Habit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "400":
          description: Invalid habit name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Habit name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /habits/{habit_id}:
    parameters:
      - name: habit_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get one habit
      responses:
        "200":
          description: Habit returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a habit
      responses:
        "204":
          description: Habit deleted
        "404":
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Habit:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    Health:
      type: object
      required: [status, db, version]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        db:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
